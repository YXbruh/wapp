<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>linux-wasm terminal test</title>
<link rel="stylesheet" href="Scripts/v86/xterm.css" />
<style>
body{background:#111;font-family:sans-serif}
.wasm-term{background:#0a0f0e;border:1px solid #333;border-radius:10px;padding:10px;min-height:380px;max-width:820px;margin:20px auto}
.wasm-term .xterm{height:100%}
</style>
</head>
<body>
<div id="termRoot"
     data-user="student"
     data-host="cybershield-lab"
     data-flag="CSA{wasm_flag_test}"
     data-motd="CyberShield practice shell (test)"
     data-savekey="wasmtest"
     data-v86base="Scripts/v86/">
    <p style="color:#ccc;font-family:sans-serif;text-align:center">
        <button onclick="csaTerm.save()">Save</button>
        <button onclick="csaTerm.reset()">Reset</button>
        <button onclick="csaTerm.clear()">Clear</button>
    </p>
    <div class="wasm-term" id="termScreen" tabindex="0"></div>
</div>
<script src="Scripts/v86/xterm.js"></script>
<script src="Scripts/v86/libv86.js"></script>
<script src="Scripts/linux-wasm-terminal.js"></script>
</body>
</html>
